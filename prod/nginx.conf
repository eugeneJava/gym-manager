events {
}



http {
    #Disable nginx version
    server_tokens off;
    # Define the rate-limiting zone
    limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name example.com;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen [::]:443 ssl;
        listen 443 ssl;
        server_name tstream.com.ua;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Improve SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # SSL session settings
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

          # First, deny all locations by default
        location / {
            deny all;
            return 403;
        }


      #  location / {
      #      proxy_pass http://gym-manager:8080/;
      #      proxy_set_header Host $host;
      #      proxy_set_header X-Real-IP $remote_addr;
      #      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      #      proxy_set_header X-Forwarded-Proto $scheme;
      #      autoindex off;

            # Apply rate limiting
       #     limit_req zone=one burst=20 nodelay;
      #  }

        location /bot/ {
            proxy_pass http://tg-bot:8081/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            autoindex off;

            # Apply rate limiting
            limit_req zone=one burst=20 nodelay;
        }

        # Deny access to hidden files and directories
        location ~ /\. {
            deny all;
            return 403;
        }


         # Protect against script execution in vulnerable directories
        location ~* \.(php|sh|cgi|pl|py)$ {
            deny all;
            return 403;
        }

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self';" always;
    }
}
